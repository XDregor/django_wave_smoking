<!doctype html>
{% load static %}
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>{{ product.name }} | WAVE</title>
    <link rel="stylesheet" href="{% static 'site/shared/css/theme.css' %}?v=site-scrollbar-stable1" />
    <link rel="icon" type="image/png" href="{% static 'site/shared/img/mini_logo.png' %}" />
    <link rel="stylesheet" href="{% static 'site/shared/css/product_card.css' %}?v=product-card-data-bem1" />
    <link rel="stylesheet" href="{% static 'site/shared/css/review_card.css' %}?v=review-card-mobile-component1" />
    <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    
      <link rel="stylesheet" href="{% static 'site/product_detail/css/product_detail_page.css' %}?v=product-detail-desktop5" />
      <link rel="stylesheet" href="{% static 'site/product_detail/css/product_detail_mobile.css' %}?v=product-detail-mobile-57" />
  </head>
  <body class="product-detail-page">
    {% include 'site/shared/header.html' %}
    <div id="site-content" class="site-content" data-site-content data-wave-page="product">
    {% include 'site/shared/includes/cursor.html' %}

    <main class="product-detail" data-product-detail-id="{{ product.id }}" data-product-detail-mobile-breakpoint="640">
      {% include 'site/product_detail/includes/product_detail_mobile.html' %}

      {% include 'site/product_detail/includes/product_detail_desktop.html' %}
    </main>

    <div class="product-toast" id="js_toast" role="status" aria-live="polite">
      <div class="product-toast__dot" id="js_toast_dot"></div>
      <span id="js_toast_text"></span>
    </div>

    <div class="product-lightbox" id="js_product_lightbox" role="dialog" aria-modal="true" aria-label="Просмотр изображения товара">
      <button class="product-lightbox__close" id="js_product_lightbox_close" type="button" aria-label="Закрыть">×</button>
      <button class="product-lightbox__nav product-lightbox__nav--prev" id="js_product_lightbox_prev" type="button" aria-label="Предыдущее изображение">‹</button>
      <img class="product-lightbox__image" id="js_product_lightbox_image" src="" alt="" />
      <button class="product-lightbox__nav product-lightbox__nav--next" id="js_product_lightbox_next" type="button" aria-label="Следующее изображение">›</button>
    </div>

    <script src="{% static 'site/shared/js/product_card.js' %}?v=product-card-side-close1"></script>
    <div id="product_sku_payload" data-sku-payload="{{ sku_payload_json|default:'[]' }}" hidden></div>
    <script src="{% static 'site/product_detail/js/product_detail_page.js' %}?v=product-detail-state3"></script>
    <script src="{% static 'site/product_detail/js/product_detail_mobile.js' %}?v=product-detail-mobile-46"></script>
    </div>
  </body>
</html>
