{% load static %}
<section
  class="main_banner wave-campaign"
  id="mainBanner"
  aria-labelledby="mainBannerTitle"
  data-smoke-vertical="{% static 'site/shared/img/main_banner/ambient-smoke-vertical.webp' %}"
  data-smoke-floor="{% static 'site/shared/img/main_banner/ambient-smoke-floor.webp' %}"
  data-devices-product="{% static 'site/shared/img/main_banner/devices-product.webp' %}"
  data-cartridges-product="{% static 'site/shared/img/main_banner/cartridges-product.webp' %}"
  data-tastes-product="{% static 'site/shared/img/main_banner/tastes-product.webp' %}"
  data-devices-background="{% static 'site/shared/img/main_banner/devices-background.webp' %}"
  data-devices-rock-base="{% static 'site/shared/img/main_banner/devices-rock-base.webp' %}"
  data-devices-rock-corner="{% static 'site/shared/img/main_banner/devices-rock-corner.webp' %}"
  data-cartridges-background="{% static 'site/shared/img/main_banner/cartridges-background.webp' %}"
  data-cartridges-corner-right="{% static 'site/shared/img/main_banner/cartridges-corner-right.webp' %}"
  data-cartridges-branches-left="{% static 'site/shared/img/main_banner/cartridges-branches-left.webp' %}"
  data-cartridges-mint-splash="{% static 'site/shared/img/main_banner/cartridges-mint-splash.webp' %}"
  data-cartridges-soft-smoke="{% static 'site/shared/img/main_banner/cartridges-soft-smoke.webp' %}"
  data-tastes-background="{% static 'site/shared/img/main_banner/tastes-background.jpg' %}"
  data-tastes-corner-left="{% static 'site/shared/img/main_banner/tastes-corner-left.webp' %}"
  data-tastes-corner-right="{% static 'site/shared/img/main_banner/tastes-corner-right.webp' %}"
  data-tastes-splash-bottom="{% static 'site/shared/img/main_banner/tastes-splash-bottom.webp' %}"
>
  <div class="wave-campaign__backdrop" aria-hidden="true">
    <img class="wave-campaign__backdrop-image" id="mainBannerBackdrop" alt="" decoding="async" />
    <img class="wave-campaign__smoke wave-campaign__smoke--vertical" id="mainBannerSmokeVertical" alt="" decoding="async" />
    <img class="wave-campaign__smoke wave-campaign__smoke--floor" id="mainBannerSmokeFloor" alt="" decoding="async" />
  </div>

  <div class="wave-campaign__scene-art wave-campaign__scene-art--back" id="mainBannerBackArt" aria-hidden="true">
    <span class="wave-campaign__decor-shell" data-back-decor="0"><img alt="" decoding="async" /></span>
    <span class="wave-campaign__decor-shell" data-back-decor="1"><img alt="" decoding="async" /></span>
    <span class="wave-campaign__decor-shell" data-back-decor="2"><img alt="" decoding="async" /></span>
    <span class="wave-campaign__decor-shell" data-back-decor="3"><img alt="" decoding="async" /></span>
  </div>

  <div class="wave-campaign__frame">
    <div class="wave-campaign__content">
      <div class="wave-campaign__copy" id="mainBannerCopy">
        <div class="wave-campaign__message">
          <h1 class="wave-campaign__title" id="mainBannerTitle">
            <span class="wave-campaign__title-line">
              <span class="wave-campaign__title-text">Вкус, который</span>
            </span>
            <span class="wave-campaign__title-line wave-campaign__title-line--accent">
              <span class="wave-campaign__title-text">держит ритм.</span>
            </span>
          </h1>
          <p class="wave-campaign__description" id="mainBannerDescription">
            Современные устройства для ровной и контролируемой подачи. Компактный формат, понятное управление и ничего лишнего.
          </p>
        </div>
        <div class="wave-campaign__actions">
          <a class="wave-campaign__cta wave-campaign__cta--primary" id="mainBannerCta" href="#products">
            <span class="wave-campaign__cta-text" id="mainBannerCtaText">Выбрать</span>
          </a>
        </div>
      </div>

    </div>
  </div>

  <div class="wave-campaign__stage" id="mainBannerVisual" aria-live="polite">
        <img class="wave-campaign__visual wave-campaign__visual--primary" id="mainBannerPrimaryVisual" alt="Устройства для вейпинга" decoding="async" />
        <img class="wave-campaign__visual wave-campaign__visual--secondary" id="mainBannerSecondaryVisual" alt="" decoding="async" hidden />
  </div>
  <div class="wave-campaign__scene-art wave-campaign__scene-art--front" id="mainBannerFrontArt" aria-hidden="true">
    <span class="wave-campaign__decor-shell" data-front-decor="0"><img alt="" decoding="async" /></span>
    <span class="wave-campaign__decor-shell" data-front-decor="1"><img alt="" decoding="async" /></span>
  </div>
  <nav class="wave-campaign__dots" id="mainBannerDots" aria-label="Сцены баннера">
    <span class="wave-campaign__dot-morph" id="mainBannerDotMorph" aria-hidden="true"></span>
  </nav>
</section>
