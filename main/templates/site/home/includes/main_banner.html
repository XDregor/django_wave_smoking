{% load static %}
<section
  class="main_banner wave_campaign_hero"
  id="mainBanner"
  aria-labelledby="mainBannerTitle"
  data-smoke-vertical="{% static 'site/shared/img/main_banner/ambient-smoke-vertical.webp' %}"
  data-smoke-floor="{% static 'site/shared/img/main_banner/ambient-smoke-floor.webp' %}"
  data-devices-product="{% static 'site/shared/img/main_banner/devices-product.webp' %}"
  data-cartridges-product="{% static 'site/shared/img/main_banner/cartridges-product.webp' %}"
  data-tastes-product="{% static 'site/shared/img/main_banner/tastes-product.webp' %}"
  data-devices-background="{% static 'site/shared/img/main_banner/devices-background.webp' %}"
  data-devices-rock-base="{% static 'site/shared/img/main_banner/devices-rock-base.webp' %}"
  data-devices-rock-corner="{% static 'site/shared/img/main_banner/devices-rock-corner.webp' %}"
  data-cartridges-background="{% static 'site/shared/img/main_banner/cartridges-background.webp' %}"
  data-cartridges-corner-right="{% static 'site/shared/img/main_banner/cartridges-corner-right.webp' %}"
  data-cartridges-branches-left="{% static 'site/shared/img/main_banner/cartridges-branches-left.webp' %}"
  data-cartridges-mint-splash="{% static 'site/shared/img/main_banner/cartridges-mint-splash.webp' %}"
  data-cartridges-soft-smoke="{% static 'site/shared/img/main_banner/cartridges-soft-smoke.webp' %}"
  data-tastes-background="{% static 'site/shared/img/main_banner/tastes-background.jpg' %}"
  data-tastes-corner-left="{% static 'site/shared/img/main_banner/tastes-corner-left.webp' %}"
  data-tastes-corner-right="{% static 'site/shared/img/main_banner/tastes-corner-right.webp' %}"
  data-tastes-splash-bottom="{% static 'site/shared/img/main_banner/tastes-splash-bottom.webp' %}"
>
  <div class="wave_campaign_backdrop" aria-hidden="true">
    <img class="wave_campaign_backdrop_image" id="mainBannerBackdrop" alt="" decoding="async" />
    <img class="wave_campaign_smoke wave_campaign_smoke--vertical" id="mainBannerSmokeVertical" alt="" decoding="async" />
    <img class="wave_campaign_smoke wave_campaign_smoke--floor" id="mainBannerSmokeFloor" alt="" decoding="async" />
  </div>

  <div class="wave_campaign_scene_art wave_campaign_scene_art--back" id="mainBannerBackArt" aria-hidden="true">
    <span class="wave_campaign_decor_shell" data-back-decor="0"><img alt="" decoding="async" /></span>
    <span class="wave_campaign_decor_shell" data-back-decor="1"><img alt="" decoding="async" /></span>
    <span class="wave_campaign_decor_shell" data-back-decor="2"><img alt="" decoding="async" /></span>
    <span class="wave_campaign_decor_shell" data-back-decor="3"><img alt="" decoding="async" /></span>
  </div>

  <div class="wave_campaign_frame">
    <div class="wave_campaign_content">
      <div class="wave_campaign_copy" id="mainBannerCopy">
        <h1 class="wave_campaign_title" id="mainBannerTitle">
          Вкус, который<br /><span>держит ритм.</span>
        </h1>
        <p class="wave_campaign_description" id="mainBannerDescription">
          Современные устройства для ровной и контролируемой подачи. Компактный формат, понятное управление и ничего лишнего.
        </p>
        <div class="wave_campaign_actions">
          <a class="wave_campaign_cta wave_campaign_cta--primary" id="mainBannerCta" href="#products">
            <span id="mainBannerCtaText">Смотреть устройства</span>
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
          </a>
        </div>
      </div>

    </div>
  </div>

  <div class="wave_campaign_stage" id="mainBannerVisual" aria-live="polite">
        <img class="wave_campaign_visual wave_campaign_visual--primary" id="mainBannerPrimaryVisual" alt="Устройства для вейпинга" decoding="async" />
        <img class="wave_campaign_visual wave_campaign_visual--secondary" id="mainBannerSecondaryVisual" alt="" decoding="async" hidden />
  </div>
  <div class="wave_campaign_scene_art wave_campaign_scene_art--front" id="mainBannerFrontArt" aria-hidden="true">
    <span class="wave_campaign_decor_shell" data-front-decor="0"><img alt="" decoding="async" /></span>
    <span class="wave_campaign_decor_shell" data-front-decor="1"><img alt="" decoding="async" /></span>
  </div>
  <nav class="wave_campaign_dots" id="mainBannerDots" aria-label="Сцены баннера">
    <span class="wave_campaign_dot_morph" id="mainBannerDotMorph" aria-hidden="true"></span>
  </nav>
</section>
