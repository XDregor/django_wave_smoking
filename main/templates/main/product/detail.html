<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ product.name }} | WAVE</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        background: #010101;
        color: #f1f1f1;
        font-family: Arial, sans-serif;
      }

      .product_demo_page {
        width: min(960px, calc(100% - 32px));
        margin: 0 auto;
        padding: 110px 0 56px;
      }

      .product_demo_back {
        color: #bff747;
        text-decoration: none;
      }

      .product_demo_card {
        display: grid;
        grid-template-columns: minmax(220px, 360px) 1fr;
        gap: 28px;
        margin-top: 24px;
      }

      .product_demo_card img {
        width: 100%;
        border-radius: 18px;
        background: #151515;
      }

      .product_demo_price {
        color: #bff747;
        font-size: 28px;
        font-weight: 700;
      }

      @media (max-width: 760px) {
        .product_demo_card {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    {% include 'main/header.html' %}
    <main class="product_demo_page">
      <a class="product_demo_back" href="{% url 'main:catalog' %}">← Назад в каталог</a>
      <article class="product_demo_card">
        {% if product.image %}
          <img src="{{ product.image.url }}" alt="{{ product.name }}" />
        {% endif %}
        <div>
          <h1>{{ product.name }}</h1>
          <p class="product_demo_price">{{ product.price }} грн</p>
          <p>{{ product.description|default:'Описание товара пока не добавлено.' }}</p>
          {% if related_products %}
            <p>Похожие товары: {{ related_products|length }}</p>
          {% endif %}
        </div>
      </article>
    </main>
  </body>
</html>
