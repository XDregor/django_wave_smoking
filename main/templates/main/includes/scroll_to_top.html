<style>
  .scroll_to_top {
    position: fixed;
    bottom: 32px;
    right: 32px;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: var(--accent);
    border: none;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 500;
    opacity: 0;
    pointer-events: none;
    transform: translateY(16px);
    transition:
      opacity 0.28s ease,
      transform 0.28s ease,
      background 0.22s ease,
      box-shadow 0.22s ease;
    box-shadow: 0 6px 20px rgba(191, 247, 71, 0.22);
    cursor: pointer;
  }
  .scroll_to_top.visible {
    opacity: 1;
    pointer-events: all;
    transform: translateY(0);
  }
  .scroll_to_top:hover {
    background: #0b0b0c;
    box-shadow:
      0 6px 28px rgba(191, 247, 71, 0.18),
      inset 0 0 0 2px var(--accent);
  }
  .scroll_to_top:hover svg {
    color: var(--accent);
  }
  .scroll_to_top svg {
    width: 20px;
    height: 20px;
    color: #0b0b0c;
    transition: color 0.22s ease;
  }
  @media (max-width: 768px) {
    .scroll_to_top {
      bottom: 24px;
      right: 20px;
      width: 42px;
      height: 42px;
    }
  }
  @media (max-width: 480px) {
    .scroll_to_top {
      bottom: 16px;
      right: 12px;
      width: 38px;
      height: 38px;
    }
    .scroll_to_top svg {
      width: 17px;
      height: 17px;
    }
  }
</style>

<button class="scroll_to_top" id="scrollToTop" title="Наверх" type="button" data-scroll-to-top>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15" /></svg>
</button>

<script>
  (function () {
    function scrollToTop(smooth = true) {
      window.scrollTo({ top: 0, behavior: smooth ? "smooth" : "instant" });
    }

    const topBtn = document.getElementById("scrollToTop");
    if (!topBtn) return;

    window.addEventListener(
      "scroll",
      () => {
        topBtn.classList.toggle("visible", window.scrollY > 400);
      },
      { passive: true },
    );

    topBtn.addEventListener("click", () => scrollToTop(true));
  })();
</script>
