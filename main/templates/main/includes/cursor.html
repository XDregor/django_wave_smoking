<style>
  .cursor_dot_component {
    position: fixed;
    top: 0;
    left: 0;
    border-radius: 50%;
    pointer-events: none;
    z-index: 9998;
    transform: translate3d(-50%, -50%, 0);
    will-change: transform;
    transition:
      opacity 0.12s ease,
      width 0.12s ease,
      height 0.12s ease,
      background-color 0.12s ease,
      border-color 0.12s ease;
  }
  .cursor_dot_small_variant {
    width: 6px;
    height: 6px;
    background: var(--accent, #bff747);
  }
  .cursor_dot_large_variant {
    width: 30px;
    height: 30px;
    border: 1px solid var(--accent, #bff747);
    opacity: 0.8;
    background: transparent;
  }
  .cursor_dot_component.cursor_dot_hover_state {
    width: 70px;
    height: 70px;
    background: var(--accent, #bff747);
    border-color: var(--accent, #bff747);
    opacity: 0.3;
  }
  @media (pointer: coarse) {
    .cursor_dot_component {
      display: none;
    }
  }
</style>

<div class="cursor_dot_component cursor_dot_small_variant" id="cursor_dot_small_id"></div>
<div class="cursor_dot_component cursor_dot_large_variant" id="cursor_dot_large_id"></div>

<script>
  (() => {
    if (window.__waveCursorInitialized) return;
    window.__waveCursorInitialized = true;

    const smallNodes = document.querySelectorAll("#cursor_dot_small_id, #cursorSmall");
    const largeNodes = document.querySelectorAll("#cursor_dot_large_id, #cursorLarge");
    smallNodes.forEach((node, index) => {
      if (index > 0) node.remove();
    });
    largeNodes.forEach((node, index) => {
      if (index > 0) node.remove();
    });

    const small = smallNodes[0];
    const large = largeNodes[0];
    if (!small || !large) return;

    if (window.matchMedia("(pointer: coarse)").matches) {
      small.style.display = "none";
      large.style.display = "none";
      return;
    }

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let smallX = mouseX;
    let smallY = mouseY;
    let largeX = mouseX;
    let largeY = mouseY;

    document.addEventListener("mousemove", (event) => {
      mouseX = event.clientX;
      mouseY = event.clientY;
    });

    document.addEventListener("mouseover", (event) => {
      if (event.target.closest("a, button, input, textarea, select, [role='button']")) {
        large.classList.add("cursor_dot_hover_state");
      }
    });

    document.addEventListener("mouseout", (event) => {
      if (event.target.closest("a, button, input, textarea, select, [role='button']")) {
        large.classList.remove("cursor_dot_hover_state");
      }
    });

    function draw(el, x, y) {
      el.style.transform = `translate3d(${x}px, ${y}px, 0) translate(-50%, -50%)`;
    }

    function animate() {
      smallX += (mouseX - smallX) * 0.45;
      smallY += (mouseY - smallY) * 0.45;
      largeX += (mouseX - largeX) * 0.24;
      largeY += (mouseY - largeY) * 0.24;
      draw(small, smallX, smallY);
      draw(large, largeX, largeY);
      requestAnimationFrame(animate);
    }

    animate();
  })();
</script>
